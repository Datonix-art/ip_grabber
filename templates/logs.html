<!DOCTYPE html>
<html>
<head>
  <title>Visit logs</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1px solid #ccc; padding: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Recent visits</h1>
  <table>
    <tr><th>ID</th><th>IP</th><th>Time (UTC)</th><th>Path</th><th>User agent</th></tr>
    {% for r in rows %}
    <tr>
      <td>{{ r.id }}</td><td>{{ r.ip }}</td><td>{{ r.timestamp }}</td>
      <td>{{ r.path }}</td><td>{{ r.user_agent }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
